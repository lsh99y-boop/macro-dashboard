name: Build & Deploy Macro Dashboard

on:
  schedule:
    - cron: '0 21 * * *'   # 매일 21:00 UTC = 매일 06:00 KST
  workflow_dispatch: {}      # 수동 실행 버튼
  push:
    branches: [main]         # 코드 변경 시에도 재배포

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Korean fonts   # 차트 한글 렌더용
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          sudo fc-cache -f
      - name: Install deps
        run: pip install -r requirements-web.txt
      - name: Build site
        env:
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
        run: |
          rm -rf ~/.cache/matplotlib   # 폰트 캐시 재생성(나눔고딕 인식)
          python build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
